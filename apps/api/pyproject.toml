[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenny-growth-api"
version = "0.1.0"
description = "FastAPI backend for the localhost Lenny's Growth Assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bleach==6.2.0",
  "chromadb==1.0.20",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "markdown==3.8.2",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres_integration: requires an explicitly configured disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
